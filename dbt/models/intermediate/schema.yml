      - name: subsector
        description: Subsector de negocio.

      - name: duracion_segundos
        description: Duración real emitida en segundos.

      - name: costo_usd_real
        description: Costo del spot en USD. NULL para México y para Brasil cuando ValorDolar=0.

      - name: red
        description: Red o cadena del canal. Solo Brasil; NULL para México.

      - name: operador
        description: Operador de cable. Solo Brasil; NULL para México.

      - name: programa
        description: Programa del spot. Solo Brasil; NULL para México.

      - name: agencia
        description: Agencia publicitaria. Solo Brasil; NULL para México.

      - name: es_primera_emision
        description: TRUE si es la primera emisión. Solo Brasil; NULL para México.

      - name: estacion_canal
        description: Identificación técnica de la estación. Solo México; NULL para Brasil.

      - name: grupo_estacion
        description: Grupo de la estación. Solo México; NULL para Brasil.

      - name: grupo_comercial
        description: Grupo comercial del canal. Solo México; NULL para Brasil.

      - name: cobertura
        description: Alcance geográfico. Solo México; NULL para Brasil.

      - name: categoria
        description: Categoría de producto. Solo México; NULL para Brasil.

