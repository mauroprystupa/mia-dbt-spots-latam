version: 2

models:
  - name: int_spots_unificados
    description: >
      UNION ALL de stg_brasil y stg_mexico con schema canónico común.
      Normaliza medio_raw al enum (TELEVISION_CABLE, TELEVISION_ABIERTA, RADIO_FM, RADIO_AM).
      Sin dedup ni is_valid — eso es responsabilidad de int_spots_validados.
      Columnas market-specific se preservan como NULL para el mercado que no las tiene.
    columns:
      - name: mercado
        description: Mercado de emisión. BRASIL o MEXICO.
        tests:
          - not_null
          - accepted_values:
              values: ['BRASIL', 'MEXICO']

      - name: archivo_fuente
        description: >
          Fecha de auditoría del proveedor en formato YYYYMMDD. Discrimina dia1 vs dia2.
          Ver sección Supuestos en README.
        tests:
          - not_null

      - name: updated_at
        description: Timestamp de carga del registro en BigQuery.

      - name: fecha_emision
        description: Fecha de emisión en hora local.
        tests:
          - not_null

      - name: hora_emision
        description: Hora de emisión en hora local.
        tests:
          - not_null

      - name: medio_raw
        description: Valor original del campo medio en la fuente. Se preserva para auditoría.
        tests:
          - not_null

      - name: medio
        description: >
          Tipo de medio normalizado al enum canónico.
          TELEVISION_CABLE, TELEVISION_ABIERTA, RADIO_FM, RADIO_AM.
        tests:
          - not_null
          - accepted_values:
              values: ['TELEVISION_CABLE', 'TELEVISION_ABIERTA', 'RADIO_FM', 'RADIO_AM']

      - name: canal_raw
        description: Nombre del canal tal como viene en la fuente.
        tests:
          - not_null

      - name: localidad
        description: Ciudad o plaza de emisión.

      - name: spot_tipo
        description: Tipo de spot comercial. Ej. SPOT REGULAR, PATROCINIO.

      - name: marca_raw
        description: Nombre de marca tal como viene en la fuente.
        tests:
          - not_null

      - name: producto
        description: Línea de producto dentro de la marca.

      - name: version
        description: Versión del spot. En México puede contener el texto completo del audio.

      - name: sector
        description: Sector de negocio de la marca.

      - name: subsector
        description: Subsector de negocio.

      - name: duracion_segundos
        description: Duración real emitida en segundos.
        tests:
          - not_null

      - name: costo_usd_real
        description: >
          Costo del spot en USD. NULL cuando el valor fuente es 0.0 (Brasil) o cuando
          no hay datos de costo en la fuente (México siempre NULL).

      - name: red
        description: Red o cadena a la que pertenece la emisora. Solo Brasil; NULL para México.

      - name: operador
        description: Operador de cable o plataforma distribuidora. Solo Brasil; NULL para México.

      - name: programa
        description: Programa en el que se emitió el spot. Solo Brasil, ~80% nulos; NULL para México.

      - name: agencia
        description: Agencia publicitaria responsable del spot. Solo Brasil; NULL para México.

      - name: es_primera_emision
        description: TRUE si es la primera emisión del spot. Solo Brasil; NULL para México.

      - name: estacion_canal
        description: Identificación técnica de la estación con frecuencia y código. Solo México; NULL para Brasil.

      - name: grupo_estacion
        description: Grupo al que pertenece la estación. Solo México; NULL para Brasil.

      - name: grupo_comercial
        description: Grupo comercial propietario del canal. Solo México; NULL para Brasil.

      - name: cobertura
        description: Alcance geográfico del spot. NACIONAL o LOCAL. Solo México; NULL para Brasil.

      - name: categoria
        description: Categoría de producto. Solo México; NULL para Brasil.

      - name: duracion_programada_segundos
        description: >
          Duración planificada del spot en segundos. Solo México; NULL para Brasil.
          Forma parte de la clave natural de México en int_spots_validados.

      - name: segundos_truncados
        description: Segundos no emitidos por corte del spot. Solo México; NULL para Brasil.

  - name: int_spots_validados
    description: >
      Deduplicación cross-archivo y clasificación de validez.
      Dia2 gana frente a dia1 en la misma clave natural.
      is_valid=FALSE marca falsos positivos (spots que aparecen en dia1 pero no en dia2,
      y cuya fecha no es la mínima del dia1, es decir, no cayeron de la ventana deslizante).
      Todos los registros se preservan — is_valid=FALSE nunca se elimina físicamente.
    columns:
      - name: mercado
        description: Mercado de emisión. BRASIL o MEXICO.
        tests:
          - not_null
          - accepted_values:
              values: ['BRASIL', 'MEXICO']

      - name: archivo_fuente
        description: >
          Fecha de auditoría del proveedor en formato YYYYMMDD. Discrimina dia1 vs dia2.
          Ver sección Supuestos en README.
        tests:
          - not_null

      - name: updated_at
        description: Timestamp de carga del registro en BigQuery.

      - name: fecha_emision
        description: Fecha de emisión en hora local.
        tests:
          - not_null

      - name: hora_emision
        description: Hora de emisión en hora local.
        tests:
          - not_null

      - name: medio_raw
        description: Valor original del campo medio en la fuente. Se preserva para auditoría.

      - name: medio
        description: Tipo de medio normalizado al enum canónico.
        tests:
          - not_null
          - accepted_values:
              values: ['TELEVISION_CABLE', 'TELEVISION_ABIERTA', 'RADIO_FM', 'RADIO_AM']

      - name: canal_raw
        description: Nombre del canal tal como viene en la fuente.
        tests:
          - not_null

      - name: localidad
        description: Ciudad o plaza de emisión.

      - name: spot_tipo
        description: Tipo de spot comercial.

      - name: marca_raw
        description: Nombre de marca tal como viene en la fuente.
        tests:
          - not_null

      - name: producto
        description: Línea de producto dentro de la marca.

      - name: version
        description: Versión del spot.

      - name: sector
        description: Sector de negocio de la marca.

      - name: subsector
        description: Subsector de negocio.

      - name: duracion_segundos
        description: Duración real emitida en segundos.
        tests:
          - not_null

      - name: costo_usd_real
        description: >
          Costo del spot en USD. NULL cuando el valor fuente es 0.0 (Brasil) o cuando
          no hay datos de costo en la fuente (México siempre NULL).

      - name: red
        description: Red o cadena a la que pertenece la emisora. Solo Brasil; NULL para México.

      - name: operador
        description: Operador de cable o plataforma distribuidora. Solo Brasil; NULL para México.

      - name: programa
        description: Programa en el que se emitió el spot. Solo Brasil, ~80% nulos; NULL para México.

      - name: agencia
        description: Agencia publicitaria responsable del spot. Solo Brasil; NULL para México.

      - name: es_primera_emision
        description: TRUE si es la primera emisión del spot. Solo Brasil; NULL para México.

      - name: estacion_canal
        description: Identificación técnica de la estación. Solo México; NULL para Brasil.

      - name: grupo_estacion
        description: Grupo al que pertenece la estación. Solo México; NULL para Brasil.

      - name: grupo_comercial
        description: Grupo comercial propietario del canal. Solo México; NULL para Brasil.

      - name: cobertura
        description: Alcance geográfico del spot. NACIONAL o LOCAL. Solo México; NULL para Brasil.

      - name: categoria
        description: Categoría de producto. Solo México; NULL para Brasil.

      - name: duracion_programada_segundos
        description: Duración planificada en segundos. Solo México; NULL para Brasil.

      - name: segundos_truncados
        description: Segundos no emitidos por corte del spot. Solo México; NULL para Brasil.

      - name: is_valid
        description: >
          FALSE = falso positivo (dia1 sin confirmación en dia2 y fecha > min_fecha_dia1).
          TRUE = spot válido para análisis.
        tests:
          - not_null

  - name: int_segmentos_horarios
    description: >
      Agrega segmento_horario según la hora local de cada spot.
      Primetime cruza medianoche: 18:00–01:59. Day: 08:00–17:59. Greytime: 02:00–07:59.
    columns:
      - name: mercado
        description: Mercado de emisión. BRASIL o MEXICO.
        tests:
          - not_null

      - name: archivo_fuente
        description: Fecha de auditoría del proveedor en formato YYYYMMDD.

      - name: updated_at
        description: Timestamp de carga del registro en BigQuery.

      - name: fecha_emision
        description: Fecha de emisión en hora local.
        tests:
          - not_null

      - name: hora_emision
        description: Hora de emisión en hora local.
        tests:
          - not_null

      - name: medio_raw
        description: Valor original del campo medio en la fuente.

      - name: medio
        description: Tipo de medio normalizado al enum canónico.

      - name: canal_raw
        description: Nombre del canal tal como viene en la fuente.

      - name: localidad
        description: Ciudad o plaza de emisión.

      - name: spot_tipo
        description: Tipo de spot comercial.

      - name: marca_raw
        description: Nombre de marca tal como viene en la fuente.

      - name: producto
        description: Línea de producto dentro de la marca.

      - name: version
        description: Versión del spot.

      - name: sector
        description: Sector de negocio de la marca.

      - name: subsector
        description: Subsector de negocio.

      - name: duracion_segundos
        description: Duración real emitida en segundos.

      - name: costo_usd_real
        description: Costo del spot en USD. NULL para México y para Brasil cuando ValorDolar=0.

      - name: red
        description: Red o cadena del canal. Solo Brasil; NULL para México.

      - name: operador
        description: Operador de cable. Solo Brasil; NULL para México.

      - name: programa
        description: Programa del spot. Solo Brasil; NULL para México.

      - name: agencia
        description: Agencia publicitaria. Solo Brasil; NULL para México.

      - name: es_primera_emision
        description: TRUE si es la primera emisión. Solo Brasil; NULL para México.

      - name: estacion_canal
        description: Identificación técnica de la estación. Solo México; NULL para Brasil.

      - name: grupo_estacion
        description: Grupo de la estación. Solo México; NULL para Brasil.

      - name: grupo_comercial
        description: Grupo comercial del canal. Solo México; NULL para Brasil.

      - name: cobertura
        description: Alcance geográfico. Solo México; NULL para Brasil.

      - name: categoria
        description: Categoría de producto. Solo México; NULL para Brasil.

      - name: duracion_programada_segundos
        description: Duración planificada en segundos. Solo México; NULL para Brasil.

      - name: segundos_truncados
        description: Segundos no emitidos por corte. Solo México; NULL para Brasil.

      - name: is_valid
        description: >
          FALSE = falso positivo. TRUE = spot válido para análisis.
        tests:
          - not_null

      - name: segmento_horario
        description: Franja horaria del spot según hora local. Primetime, Day o Greytime.
        tests:
          - not_null
          - accepted_values:
              values: ['Primetime', 'Day', 'Greytime']

  - name: int_costos_estimados
    description: >
      Calcula costo_usd_estimado y costo_usd_final para todos los spots.
      costo_usd_final nunca es NULL: usa COALESCE de 3 niveles de fallback cuando no hay costo real.
      Nivel 1 = AVG por (mercado, medio, segmento_horario).
      Nivel 2 = AVG por (medio, segmento_horario) cross-mercado.
      Nivel 3 = AVG por segmento_horario (garantía anti-NULL).
    columns:
      - name: mercado
        description: Mercado de emisión. BRASIL o MEXICO.
        tests:
          - not_null

      - name: archivo_fuente
        description: Fecha de auditoría del proveedor en formato YYYYMMDD.

      - name: updated_at
        description: Timestamp de carga del registro en BigQuery.

      - name: fecha_emision
        description: Fecha de emisión en hora local.

      - name: hora_emision
        description: Hora de emisión en hora local.

      - name: medio_raw
        description: Valor original del campo medio en la fuente.

      - name: medio
        description: Tipo de medio normalizado al enum canónico.

      - name: canal_raw
        description: Nombre del canal tal como viene en la fuente.

      - name: localidad
        description: Ciudad o plaza de emisión.

      - name: spot_tipo
        description: Tipo de spot comercial.

      - name: marca_raw
        description: Nombre de marca tal como viene en la fuente.

      - name: producto
        description: Línea de producto dentro de la marca.

      - name: version
        description: Versión del spot.

      - name: sector
        description: Sector de negocio de la marca.

      - name: subsector
        description: Subsector de negocio.

      - name: duracion_segundos
        description: Duración real emitida en segundos.

      - name: costo_usd_real
        description: Costo del spot en USD. NULL para México y para Brasil cuando ValorDolar=0.

      - name: red
        description: Red o cadena del canal. Solo Brasil; NULL para México.

      - name: operador
        description: Operador de cable. Solo Brasil; NULL para México.

      - name: programa
        description: Programa del spot. Solo Brasil; NULL para México.

      - name: agencia
        description: Agencia publicitaria. Solo Brasil; NULL para México.

      - name: es_primera_emision
        description: TRUE si es la primera emisión. Solo Brasil; NULL para México.

      - name: estacion_canal
        description: Identificación técnica de la estación. Solo México; NULL para Brasil.

      - name: grupo_estacion
        description: Grupo de la estación. Solo México; NULL para Brasil.

      - name: grupo_comercial
        description: Grupo comercial del canal. Solo México; NULL para Brasil.

      - name: cobertura
        description: Alcance geográfico. Solo México; NULL para Brasil.

      - name: categoria
        description: Categoría de producto. Solo México; NULL para Brasil.

      - name: duracion_programada_segundos
        description: Duración planificada en segundos. Solo México; NULL para Brasil.

      - name: segundos_truncados
        description: Segundos no emitidos por corte. Solo México; NULL para Brasil.

      - name: is_valid
        description: FALSE = falso positivo. TRUE = spot válido para análisis.

      - name: segmento_horario
        description: Franja horaria del spot. Primetime, Day o Greytime.

      - name: costo_usd_estimado
        description: >
          Promedio de costo calculado por fallback de 3 niveles: (mercado, medio, segmento),
          luego (medio, segmento) cross-mercado, luego solo segmento.
          Puede ser NULL en el caso extremo de que ningún spot del dataset tenga costo real para ese segmento horario.
          costo_usd_final es quien prioriza el dato real sobre el estimado.

      - name: costo_usd_final
        description: >
          COALESCE(costo_usd_real, costo_usd_estimado). Nunca NULL.
          Es el costo a usar en análisis y dashboards.
        tests:
          - not_null

  - name: int_canales_normalizados
    description: >
      Enriquece cada spot con canal_normalizado y grupo_canal via JOIN contra mia_ref.ref_canales.
      Fallback: canal_normalizado = canal_raw si no hay match en ref. grupo_canal puede ser NULL.
    columns:
      - name: mercado
        description: Mercado de emisión. BRASIL o MEXICO.
        tests:
          - not_null

      - name: archivo_fuente
        description: Fecha de auditoría del proveedor en formato YYYYMMDD.

      - name: updated_at
        description: Timestamp de carga del registro en BigQuery.

      - name: fecha_emision
        description: Fecha de emisión en hora local.

      - name: hora_emision
        description: Hora de emisión en hora local.

      - name: medio_raw
        description: Valor original del campo medio en la fuente.

      - name: medio
        description: Tipo de medio normalizado al enum canónico.

      - name: canal_raw
        description: Nombre del canal tal como viene en la fuente.
        tests:
          - not_null

      - name: localidad
        description: Ciudad o plaza de emisión.

      - name: spot_tipo
        description: Tipo de spot comercial.

      - name: marca_raw
        description: Nombre de marca tal como viene en la fuente.

      - name: producto
        description: Línea de producto dentro de la marca.

      - name: version
        description: Versión del spot.

      - name: sector
        description: Sector de negocio de la marca.

      - name: subsector
        description: Subsector de negocio.

      - name: duracion_segundos
        description: Duración real emitida en segundos.

      - name: costo_usd_real
        description: Costo del spot en USD. NULL para México y para Brasil cuando ValorDolar=0.

      - name: red
        description: Red o cadena del canal. Solo Brasil; NULL para México.

      - name: operador
        description: Operador de cable. Solo Brasil; NULL para México.

      - name: programa
        description: Programa del spot. Solo Brasil; NULL para México.

      - name: agencia
        description: Agencia publicitaria. Solo Brasil; NULL para México.

      - name: es_primera_emision
        description: TRUE si es la primera emisión. Solo Brasil; NULL para México.

      - name: estacion_canal
        description: Identificación técnica de la estación. Solo México; NULL para Brasil.

      - name: grupo_estacion
        description: Grupo de la estación. Solo México; NULL para Brasil.

      - name: grupo_comercial
        description: Grupo comercial del canal. Solo México; NULL para Brasil.

      - name: cobertura
        description: Alcance geográfico. Solo México; NULL para Brasil.

      - name: categoria
        description: Categoría de producto. Solo México; NULL para Brasil.

      - name: duracion_programada_segundos
        description: Duración planificada en segundos. Solo México; NULL para Brasil.

      - name: segundos_truncados
        description: Segundos no emitidos por corte. Solo México; NULL para Brasil.

      - name: is_valid
        description: FALSE = falso positivo. TRUE = spot válido para análisis.

      - name: segmento_horario
        description: Franja horaria del spot. Primetime, Day o Greytime.

      - name: costo_usd_estimado
        description: Promedio de costo estimado por fallback de 3 niveles.

      - name: costo_usd_final
        description: COALESCE(costo_usd_real, costo_usd_estimado). Nunca NULL.

      - name: canal_normalizado
        description: Nombre normalizado del canal según mia_ref.ref_canales. Nunca NULL (fallback a canal_raw).
        tests:
          - not_null

      - name: grupo_canal
        description: Grupo al que pertenece el canal normalizado. NULL si el canal no tiene entrada en ref_canales.

  - name: int_marcas_normalizadas
    description: >
      Enriquece cada spot con marca_comercial via JOIN contra mia_ref.ref_marcas.
      Fallback: marca_comercial = marca_raw si no hay match en ref.
