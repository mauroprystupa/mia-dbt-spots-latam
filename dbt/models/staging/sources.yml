version: 2

sources:
  - name: mia_raw
    database: web-nineteen
    schema: mia_raw
    description: >
      Tablas consolidadas de spots de TV y Radio por mercado LATAM.
      Cada tabla agrega todos los archivos diarios de un mercado bajo la columna
      archivo_fuente (fecha del archivo, ej. '20240831') y updated_at (timestamp de carga).
      En produccion el proceso de ingesta hace append por cada archivo nuevo recibido.
      Nunca se escribe desde dbt.
    tables:
      - name: brasil
        description: >
          Tabla consolidada de spots de Brasil. Acumula archivos de auditoría del proveedor
          identificados por archivo_fuente (YYYYMMDD). staging filtra las 2 fechas más recientes
          via DENSE_RANK.
      - name: mexico
        description: >
          Tabla consolidada de spots de México. Acumula archivos de auditoría del proveedor
          identificados por archivo_fuente (YYYYMMDD). staging filtra las 2 fechas más recientes
          via DENSE_RANK.

  - name: mia_ref
    database: web-nineteen
    schema: mia_ref
    description: >
      Tablas de referencia gestionadas fuera del pipeline dbt.
      Los equipos de negocio editan estas tablas directamente en BigQuery (vía Sheets)
      sin necesidad de un ciclo de deploy. Ver README para justificación de diseño vs dbt seeds.
    tables:
      - name: ref_canales
        description: >
          Mapeo de canal_raw (tal como viene en la fuente) al nombre normalizado y grupo.
          JOIN por (canal_raw, mercado). Fallback: canal_normalizado = canal_raw si no hay match.
      - name: ref_marcas
        description: >
          Mapeo de marca_raw al nombre comercial oficial.
          JOIN solo por marca_raw (normalización cross-market). Fallback: marca_comercial = marca_raw.
